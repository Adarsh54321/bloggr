<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloggr</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .container {
            padding: 40px;
            max-width: 800px;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            border-radius: 18px;
            object-fit: cover;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        p {
            font-size: 1.3rem;
            margin-bottom: 35px;
            opacity: 0.9;
        }

        button {
            padding: 16px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            background: white;
            color: #764ba2;
            /* cursor: pointer; */
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            right: 25px;
            text-align: right;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
        }

        .footer p {
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .footer a {
            color: white;
            text-decoration: none;
            margin-left: 10px;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Bloggr Logo -->
        <!-- <img src="img.png" alt="Bloggr Logo" class="logo"> -->

        <h1>Welcome to Bloggr</h1>

        <p>
            Share your thoughts, connect with friends, and explore the Bloggr community.
        </p>

        <button onclick="window.location.href='login.html'">
            Get Started
        </button>

    </div>

    <div class="footer">
        <p>Built by Adarsh</p>

        <a href="https://www.linkedin.com/in/adarsh-palo-4216a8321" target="_blank">
            LinkedIn
        </a>
        |
        <a href="https://github.com/Adarsh54321" target="_blank">
            GitHub
        </a>
    </div>

</body>

</html>
