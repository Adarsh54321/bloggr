<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- favicon -->
     <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
     <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3"> 
     <link rel="icon" href="/favicon.ico?v=5">
     <link rel="icon" href="/favicon.ico?v=7">
    



    <title>Bloggr</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            border-radius: 15px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        button {
            padding: 15px 35px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            background: white;
            color: #764ba2;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: 25px;
            opacity: 0.8;
            font-size: 0.9rem;
        }
    </style>

</head>

<body>

    <div class="container">

        <!-- LOGO -->
        <img src="assets/logo.png" alt="Bloggr Logo" class="logo">

        <h1>🚀 Welcome to Adarsh's Bloggr</h1>

        <p>
            Share your thoughts, connect with friends,
            and explore the Bloggr community.
        </p>

        <button onclick="window.location.href='login.html'">
            Get Started
        </button>

        <div class="footer">
            Built by Adarsh
        </div>

    </div>

</body>
</html>
