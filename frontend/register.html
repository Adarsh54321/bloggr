<!DOCTYPE html>
<html>
<head>
    <title>BlogX - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>BlogX</h1>
        <h2>Register</h2>

        <form id="registerForm">

            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Choose a password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>

    <script src="script.js"></script>

</body>
</html>
